<!DOCTYPE html>
<html>
<head>
<title>HTTP Upload Server</title>

<style>
body {
    font-family: Arial;
    background-color: #111;
    color: white;
    text-align: center;
}

nav {
    background: #222;
    padding: 15px;
}

nav button {
    padding: 10px 20px;
    margin: 5px;
    background: #4CAF50;
    border: none;
    color: white;
    cursor: pointer;
}

nav button:hover {
    background: #45a049;
}

section {
    margin-top: 40px;
}

.upload-box {
    background: #222;
    padding: 25px;
    display: inline-block;
    border-radius: 8px;
}
</style>

<script>
function goUpload() {
    document.getElementById("upload").scrollIntoView({behavior: "smooth"});
}

function goAbout() {
    document.getElementById("about").scrollIntoView({behavior: "smooth"});
}
</script>

</head>

<body>

<nav>
<button onclick="goUpload()">Uploads</button>
<button onclick="goAbout()">About</button>
</nav>

<section id="upload">
<h2>📤 Upload Portal</h2>

<div class="upload-box">
<form action="/upload" method="post" enctype="multipart/form-data">
<input type="file" name="file" required><br><br>
<input type="submit" value="Upload File">
</form>
</div>

</section>

<section id="about">
<h2>ℹ️ About</h2>

<p>
Lightweight HTTP upload server for moving files between subnets.
</p>

<p>
Designed for lab environments, CTF infrastructure, and jumpbox transfers.
</p>

<button onclick="goUpload()">Go to Upload</button>

</section>

</body>
</html>
