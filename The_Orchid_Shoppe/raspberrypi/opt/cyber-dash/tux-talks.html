<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DNS Host Map!</title>

<style>
body {
  background: black;
  color: #00FF00;
  font-family: monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  margin: 0;
  padding: 40px;
}

#title {
  font-size: 2.5em;
  text-align: center;
  opacity: 1;
  transition: opacity 0.3s ease-in-out;
}

#ascii {
  white-space: pre;
  font-size: 21px;
  line-height: 1.3;
  margin-top: 40px;
  display: none;
}

#speech {
  color: cyan;
  font-style: italic;
  margin-top: 20px;
  min-height: 60px;
  display: none;
}

#effectButtons {
  display: none;
  margin-top: 30px;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

.btn {
  padding: 10px 20px;
  background: #111;
  color: #0f0;
  border: 1px solid #0f0;
  cursor: pointer;
  transform: scale(3);
  transition: transform 0.6s ease-in-out;
}

.btn.show {
  transform: scale(1);
}
</style>
</head>

<body>

<div id="title">
  Below are the buttons to link to host on the 0.0.0.0/24 Network!
</div>

<div id="ascii"></div>
<div id="speech"></div>

<div id="effectButtons">
  <button class="btn" id="restartBtn">Restart Animation</button>
  <button class="btn">host0.FQDN</button>
  <button class="btn">host1.FQDN</button>
  <button class="btn">host2.FQDN</button>
  <button class="btn">host3.FQDN</button>
  <button class="btn">host4.FQDN</button>
  <button class="btn">host5.FQDN</button>
  <button class="btn">host6.FQDN</button>
  <button class="btn">unused1</button>
  <button class="btn">unused2</button>
  <button class="btn">unused3</button>
</div>

<script>
/* ===== LOOP CONFIG ===== */
const LOOP_ENABLED = true;
const LOOP_DELAY_MS = 25000;
const FRAME_INTERVAL_MS = 600;
const SPEECH_INTERVAL_MS = 5000;
const TITLE_BLINK_MS = 300;
/* ======================= */

const title = document.getElementById('title');
const ascii = document.getElementById('ascii');
const speech = document.getElementById('speech');
const buttonsContainer = document.getElementById('effectButtons');
const restartBtn = document.getElementById('restartBtn');

let blinkCount = 0;
let frameIndex = 0;
let speechIndex = 0;
let animationInterval;

/* ===== TITLE BLINK ===== */
function blinkTitle() {
  if (blinkCount >= 6) {
    title.style.opacity = 1;
    startTuxIntro();
    return;
  }
  title.style.opacity = title.style.opacity == 0 ? 1 : 0;
  blinkCount++;
  setTimeout(blinkTitle, TITLE_BLINK_MS);
}

/* ===== ASCII FRAMES ===== */
const frames = [
`      .--.
     |o_o |
     |:_/ |
    //   \\ \\
   (|     | )
  /'\\_   _/\\\`
  \\___)=(___/`,

`      .--.
     |x_x |
     |:_/ |
    //   \\ \\
   (|     | )
  /'\\_   _/\\\`
  \\___)=(___/`,

`      .--.
     |^_^ |
     |:_/ |
    //   \\ \\
   (|     | )
  /'\\_   _/\\\`
  \\___)=(___/`
];

const speechLines = [
  "Today we start with the Start Of Authority config.",
  "These buttons link to each host.",
  "Authentication is required.",
  "This file acts as a live dashboard.",
  "Remember: do not forget the hack."
];

/* ===== HOST MAP ===== */
const hostMap = {
  "host0.FQDN": "https://google.com",
  "host1.FQDN": "https://outlook.com",
  "host2.FQDN": "https://facebook.com",
  "host3.FQDN": "https://youtube.com",
  "host4.FQDN": "http://0.0.0.0",
  "host5.FQDN": "http://0.0.0.0",
  "host6.FQDN": "http://0.0.0.0",
  "unused1": "http://0.0.0.0",
  "unused2": "http://0.0.0.0",
  "unused3": "http://0.0.0.0"
};

/* ===== INTRO ===== */
function startTuxIntro() {
  ascii.style.display = 'block';
  speech.style.display = 'block';

  animationInterval = setInterval(() => {
    ascii.textContent = frames[frameIndex];
    frameIndex = (frameIndex + 1) % frames.length;
  }, FRAME_INTERVAL_MS);

  showSpeechLine();
}

/* ===== SPEECH ===== */
function showSpeechLine() {
  speech.textContent = speechLines[speechIndex++];
  if (speechIndex < speechLines.length) {
    setTimeout(showSpeechLine, SPEECH_INTERVAL_MS);
  } else {
    setTimeout(() => {
      clearInterval(animationInterval);
      showButtons();
      scheduleNextLoop();
    }, 3000);
  }
}

/* ===== BUTTONS ===== */
function showButtons() {
  buttonsContainer.style.display = 'flex';

  document.querySelectorAll('.btn').forEach(btn => {
    const host = btn.innerText.trim();
    if (hostMap[host]) {
      btn.onclick = () => window.open(hostMap[host], "_blank");
    }
    btn.classList.add('show');
  });
}

/* ===== LOOP ===== */
function scheduleNextLoop() {
  if (!LOOP_ENABLED) return;
  setTimeout(restartAnimation, LOOP_DELAY_MS);
}

/* ===== RESET ===== */
function restartAnimation() {
  clearInterval(animationInterval);
  blinkCount = frameIndex = speechIndex = 0;
  ascii.style.display = 'none';
  speech.style.display = 'none';
  buttonsContainer.style.display = 'none';
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('show'));
  blinkTitle();
}

/* ===== INIT ===== */
restartBtn.onclick = restartAnimation;
blinkTitle();
</script>

</body>
</html>
